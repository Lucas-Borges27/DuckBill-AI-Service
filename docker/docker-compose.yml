version: '3.8'

services:
  duckbill-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: borgexxx/duckbill-ai-service:latest
    container_name: duckbill_ai_service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=modelo_categorizador_bancario.pkl
      # LLM opcional: aponte para Ollama ou API compativel com OpenAI
      # - LLM_BASE_URL=http://ollama:11434
      # - LLM_MODEL=llama3
      # - LLM_TIMEOUT_SECONDS=20
      - WEB_SEARCH_ENABLED=true
      - WEB_SEARCH_MAX_RESULTS=5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
